<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso | Sistema de Salas AIEP</title><link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="topbar"><div class="brand">AIEP · GESTIÓN DE SALAS</div><span class="role">Acceso Institucional</span></header>
  <main class="wrap launch">
    <div class="eyebrow">Autenticación requerida</div><h1>Iniciar Sesión</h1>
    <p class="small">Ingresa tus credenciales asignadas.</p>
    <section class="panel">
      <div id="mensaje" class="notice" hidden></div>
      <form id="form-login">
        <div class="field"><label for="rut">RUT</label><input id="rut" placeholder="Ej: 12.345.678-9" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" type="password" placeholder="••••••••" required></div>
        <button class="button" id="btn-login" type="submit">Ingresar al sistema</button>
      </form>
    </section>
  </main>
  <script type="module">
    import { iniciarSesion } from './js/supabase-ajax.js';
    const form = document.querySelector('#form-login');
    const msg = document.querySelector('#mensaje');
    const btn = document.querySelector('#btn-login');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true;
      msg.hidden = true;
      try {
        const user = await iniciarSesion(document.querySelector('#rut').value, document.querySelector('#password').value);
        if (user.rol === 'user') window.location.href = 'docente.html';
        else if (user.rol === 'admin') window.location.href = 'coordinacion.html';
        else if (user.rol === 'superadmin') window.location.href = 'jefatura.html';
      } catch (err) {
        msg.className = 'notice error';
        msg.textContent = err.message;
        msg.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
