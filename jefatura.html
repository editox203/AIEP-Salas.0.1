<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración | Tickets AIEP</title><link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AIEP · ATENCIÓN</div>
    <span class="role">Vista Jefatura / Admin</span>
    <span class="connection" id="conexion">Conectando…</span>
    <button class="button secondary" id="btn-salir" style="padding:4px 10px;font-size:12px;">Salir</button>
  </header>
  <main class="wrap">
    <div class="heading"><div class="eyebrow">Casos escalados</div><h1>Revisión de Administración</h1><p>Resuelve las solicitudes y consulta el reporte inteligente con IA.</p></div>
    
    <!-- Sección de Asistente IA NVIDIA -->
    <section class="panel" style="margin-bottom: 20px;">
      <h2>Asistente Gerencial (IA NVIDIA)</h2>
      <div class="field"><input id="input-ia" placeholder="Ej: ¿Qué salas tienen más solicitudes pendientes?" style="width:100%; margin-bottom:10px;"></div>
      <button class="button" id="btn-consultar-ia">Consultar a la IA</button>
      <div id="respuesta-ia" class="notice" style="margin-top: 15px; white-space: pre-wrap;" hidden></div>
    </section>

    <div id="aviso" class="notice" role="status" hidden></div>
    <section><h2 class="section-title">Tickets derivados</h2><div id="bandeja-jefatura" class="tickets"><div class="empty">Cargando casos…</div></div></section>
  </main>
  <script type="module">
    import { verificarAcceso, cerrarSesion, obtenerTickets, resolverTicketAdmin, generarReporteIA } from './js/supabase-ajax.js';
    import { escucharTiempoReal } from './js/supabase-socket.js';

    const sesion = verificarAcceso('superadmin');
    if (!sesion) throw new Error('Acceso no autorizado');

    document.querySelector('#btn-salir').addEventListener('click', cerrarSesion);

    const bandeja = document.querySelector('#bandeja-jefatura');
    const aviso = document.querySelector('#aviso');
    const conexion = document.querySelector('#conexion');
    const tickets = new Map();
    const estadosVisibles = new Set(['pendiente_administracion', 'aprobado', 'rechazado']);

    const esc = valor => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const etiquetas = { pendiente_administracion: 'Pendiente de decisión', aprobado: 'Aprobado', rechazado: 'Rechazado' };

    function avisoTexto(texto, tipo = '') { aviso.className = `notice ${tipo}`; aviso.textContent = texto; aviso.hidden = !texto; }

    function tarjeta(t) {
      return `<article class="ticket" id="jef-${esc(t.id)}"><div class="ticket-top"><div><h3>Expediente #${esc(t.id)}</h3><p><strong>Motivo:</strong> ${esc(t.motivo)}</p><p class="muted">Bloque: ${esc(t.bloque)}</p></div><span class="badge ${esc(t.estado)}">${esc(etiquetas[t.estado] || t.estado)}</span></div>${t.estado === 'pendiente_administracion' ? `<div class="button-row"><button class="button" data-resolver="aprobado" data-id="${esc(t.id)}">Aprobar</button><button class="button danger" data-resolver="rechazado" data-id="${esc(t.id)}">Rechazar</button></div>` : ''}</article>`;
    }

    function dibujar() {
      bandeja.innerHTML = [...tickets.values()].filter(t => estadosVisibles.has(t.estado)).sort((a,b) => new Date(b.fecha_creacion) - new Date(a.fecha_creacion)).map(tarjeta).join('') || '<div class="empty">No hay casos derivados.</div>';
    }

    function guardar(t) { if (estadosVisibles.has(t.estado)) tickets.set(String(t.id), t); else tickets.delete(String(t.id)); dibujar(); }

    bandeja.addEventListener('click', async e => {
      const boton = e.target.closest('[data-resolver]'); if (!boton) return;
      const decision = boton.dataset.resolver;
      const mensaje = window.prompt('Mensaje o resolución para el docente (opcional):') || '';
      try {
        await resolverTicketAdmin(boton.dataset.id, sesion.id, null, mensaje, decision);
        avisoTexto(`Ticket ${decision}.`, 'success');
      } catch (error) { avisoTexto(error.message || 'No se pudo guardar la decisión.', 'error'); dibujar(); }
    });

    // Lógica del botón de IA
    document.querySelector('#btn-consultar-ia').addEventListener('click', async () => {
      const pregunta = document.querySelector('#input-ia').value.trim();
      const cajaRespuesta = document.querySelector('#respuesta-ia');
      if (!pregunta) return alert('Escribe una pregunta para la IA.');
      
      cajaRespuesta.hidden = false;
      cajaRespuesta.textContent = 'Generando respuesta con NVIDIA NIM...';
      try {
        const todos = [...tickets.values()];
        const respuesta = await generarReporteIA(pregunta, todos);
        cajaRespuesta.textContent = respuesta;
      } catch (err) {
        cajaRespuesta.textContent = 'Error al consultar la IA: ' + err.message;
      }
    });

    try {
      escucharTiempoReal({
        alCrearTicket: guardar,
        alActualizarTicket: guardar,
        alEstadoConexion: estado => {
          conexion.textContent = estado === 'SUBSCRIBED' ? 'En vivo' : `Tiempo real: ${estado}`;
          conexion.className = `connection ${estado === 'SUBSCRIBED' ? 'online' : ''}`;
        }
      });
      (await obtenerTickets()).forEach(guardar);
      dibujar();
    } catch (error) { bandeja.innerHTML = '<div class="empty">No se pudieron cargar los casos.</div>'; avisoTexto(error.message, 'error'); }
  </script>
</body>
</html>
