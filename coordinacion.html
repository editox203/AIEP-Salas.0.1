<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coordinación | Tickets AIEP</title><link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="topbar"><div class="brand">AIEP · ATENCIÓN</div><span class="role">Vista Coordinación</span><span class="connection" id="conexion">Conectando…</span></header>
  <main class="wrap">
    <div class="heading"><div class="eyebrow">Bandeja de entrada</div><h1>Solicitudes de sala</h1><p>Revisa los tickets y deriva a Jefatura los casos que requieran resolución.</p></div>
    <div id="aviso" class="notice" role="status" hidden></div>
    <section><h2 class="section-title">Todos los tickets</h2><div id="bandeja-coordinacion" class="tickets"><div class="empty">Cargando tickets…</div></div></section>
  </main>
  <script type="module">
    import { obtenerTickets, cambiarEstadoTicket } from './js/supabase-ajax.js';
    import { escucharTiempoReal } from './js/supabase-socket.js';
    const bandeja = document.querySelector('#bandeja-coordinacion');
    const aviso = document.querySelector('#aviso');
    const conexion = document.querySelector('#conexion');
    const tickets = new Map();
    const esc = valor => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const etiquetas = { open: 'Abierto', escalated: 'Derivado a Jefatura', accepted: 'Aceptado', rejected: 'Rechazado' };
    function avisoTexto(texto, tipo = '') { aviso.className = `notice ${tipo}`; aviso.textContent = texto; aviso.hidden = !texto; }
    function tarjeta(t) {
      return `<article class="ticket" id="coord-${esc(t.id)}"><div class="ticket-top"><div><h3>Ticket #${esc(t.id)} · ${esc(t.room_code)}</h3><p><strong>${esc(t.category)}</strong> — ${esc(t.description)}</p><p class="muted">Docente: ${esc(t.teacher_name)} · RUT: ${esc(t.teacher_rut)}</p><p class="muted">${t.created_at ? new Date(t.created_at).toLocaleString('es-CL') : ''}</p></div><span class="badge ${esc(t.status)}">${esc(etiquetas[t.status] || t.status)}</span></div>${t.escalation_notes ? `<p><strong>Nota de Coordinación:</strong> ${esc(t.escalation_notes)}</p>` : ''}${t.status === 'open' ? `<div class="button-row"><button class="button" data-derivar="${esc(t.id)}">Derivar a Jefatura</button></div>` : ''}</article>`;
    }
    function dibujar() {
      bandeja.innerHTML = [...tickets.values()].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).map(tarjeta).join('') || '<div class="empty">No hay tickets por mostrar.</div>';
    }
    function guardar(t) { tickets.set(String(t.id), t); dibujar(); }
    bandeja.addEventListener('click', async e => {
      const boton = e.target.closest('[data-derivar]'); if (!boton) return;
      const nota = window.prompt('Nota para Jefatura (opcional):'); if (nota === null) return;
      boton.disabled = true;
      try { await cambiarEstadoTicket(boton.dataset.derivar, 'escalated', nota.trim()); avisoTexto('Ticket derivado a Jefatura.', 'success'); }
      catch (error) { avisoTexto(error.message || 'No se pudo derivar el ticket.', 'error'); boton.disabled = false; }
    });
    try {
      escucharTiempoReal({
        alCrearTicket: guardar,
        alActualizarTicket: guardar,
        alEstadoConexion: estado => {
          conexion.textContent = estado === 'SUBSCRIBED' ? 'En vivo' : `Tiempo real: ${estado}`;
          conexion.className = `connection ${estado === 'SUBSCRIBED' ? 'online' : (estado === 'CHANNEL_ERROR' || estado === 'TIMED_OUT' ? 'offline' : '')}`;
        }
      });
      (await obtenerTickets()).forEach(guardar);
      if (!tickets.size) dibujar();
    } catch (error) { bandeja.innerHTML = '<div class="empty">No se pudieron cargar los tickets. Configura Supabase y vuelve a cargar.</div>'; avisoTexto(error.message, 'error'); }
  </script>
</body>
</html>
