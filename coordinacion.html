<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coordinación | Tickets AIEP</title><link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AIEP · ATENCIÓN</div>
    <span class="role">Vista Coordinación</span>
    <span class="connection" id="conexion">Conectando…</span>
    <button class="button secondary" id="btn-salir" style="padding:4px 10px;font-size:12px;">Salir</button>
  </header>
  <main class="wrap">
    <div class="heading"><div class="eyebrow">Bandeja de entrada</div><h1>Solicitudes de sala</h1><p>Revisa los tickets, deriva a Administración y consulta el calendario de hoy y mañana.</p></div>
    <div id="aviso" class="notice" role="status" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Secciones Coordinación">
      <button type="button" class="tab-btn active" data-tab="tab-tickets">Tickets</button>
      <button type="button" class="tab-btn" data-tab="tab-calendario">Calendario Hoy / Mañana</button>
    </nav>

    <section id="tab-tickets" class="tab-panel">
      <h2 class="section-title">Todos los tickets</h2>
      <div id="bandeja-coordinacion" class="tickets"><div class="empty">Cargando tickets…</div></div>
    </section>

    <section id="tab-calendario" class="panel tab-panel" hidden>
      <div class="cal-toolbar">
        <div>
          <h2 style="margin:0;">Calendario de Salas · Hoy y Mañana</h2>
          <p class="small" id="fechas-calendario" style="margin:4px 0 0;">Cargando fechas…</p>
        </div>
        <button type="button" class="button secondary" id="btn-refrescar-cal">Actualizar</button>
      </div>
      <div id="calendario-salas" class="cal-grid"><div class="empty">Cargando calendario…</div></div>
    </section>
  </main>

  <script type="module">
    import { verificarAcceso, cerrarSesion, obtenerTickets, derivarTicket, obtenerCalendarioSalas } from './js/supabase-ajax.js';
    import { escucharTiempoReal } from './js/supabase-socket.js';

    const sesion = verificarAcceso('admin');
    if (!sesion) throw new Error('Acceso no autorizado');

    document.querySelector('#btn-salir').addEventListener('click', cerrarSesion);

    const tabBtns = [...document.querySelectorAll('.tab-btn')];
    const tabPanels = [...document.querySelectorAll('.tab-panel')];
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.toggle('active', b === btn));
        tabPanels.forEach(p => { p.hidden = p.id !== btn.dataset.tab; });
      });
    });

    const bandeja = document.querySelector('#bandeja-coordinacion');
    const contenedorCalendario = document.querySelector('#calendario-salas');
    const fechasCalendario = document.querySelector('#fechas-calendario');
    const aviso = document.querySelector('#aviso');
    const conexion = document.querySelector('#conexion');
    const tickets = new Map();

    const esc = valor => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const etiquetas = { pendiente_coordinacion: 'Abierto', pendiente_administracion: 'Derivado a Admin', aprobado: 'Aprobado', rechazado: 'Rechazado' };

    function avisoTexto(texto, tipo = '') { aviso.className = `notice ${tipo}`; aviso.textContent = texto; aviso.hidden = !texto; }

    function tarjeta(t) {
      return `<article class="ticket" id="coord-${esc(t.id)}"><div class="ticket-top"><div><h3>Ticket #${esc(t.id)}</h3><p><strong>Motivo:</strong> ${esc(t.motivo)}</p><p class="muted">Docente ID: ${esc(t.usuario_id)} · Bloque: ${esc(t.bloque)}</p></div><span class="badge ${esc(t.estado)}">${esc(etiquetas[t.estado] || t.estado)}</span></div>${t.estado === 'pendiente_coordinacion' ? `<div class="button-row"><button class="button" data-derivar="${esc(t.id)}">Derivar a Administración</button></div>` : ''}</article>`;
    }

    function dibujar() {
      bandeja.innerHTML = [...tickets.values()].sort((a,b) => new Date(b.fecha_creacion) - new Date(a.fecha_creacion)).map(tarjeta).join('') || '<div class="empty">No hay tickets por mostrar.</div>';
    }

    function guardar(t) { tickets.set(String(t.id), t); dibujar(); }

    async function cargarCalendario() {
      try {
        const data = await obtenerCalendarioSalas();
        fechasCalendario.textContent = `Hoy: ${esc(data.hoy)} · Mañana: ${esc(data.manana)}`;
        const salas = Array.isArray(data.salas) ? data.salas : [];
        if (!salas.length) {
          contenedorCalendario.innerHTML = '<div class="empty">No hay salas registradas.</div>';
          return;
        }
        contenedorCalendario.innerHTML = salas.map(s => {
          const hoyHtml = s.disponible_hoy
            ? '<div class="cal-slot libre">Disponible hoy</div>'
            : (s.bloques_hoy || []).map(b => `<div class="cal-slot ocupado">Hoy ${esc(String(b.hora_inicio || '').slice(0,5))} - ${esc(String(b.hora_fin || '').slice(0,5))} · ${esc(b.usuario?.nombre || 'Ocupada')}</div>`).join('');

          const mananaHtml = (s.reservas_manana || []).length
            ? (s.reservas_manana || []).map(b => `<div class="cal-slot manana">Mañana ${esc(String(b.hora_inicio || '').slice(0,5))} - ${esc(String(b.hora_fin || '').slice(0,5))} · ${esc(b.usuario?.nombre || 'Reservada')}</div>`).join('')
            : '<div class="cal-slot">Sin reservas agendadas para mañana</div>';

          return `
            <article class="cal-card">
              <div class="cal-card-head">
                <h3>Sala ${esc(s.numero_sala)}</h3>
                <span class="badge ${s.disponible_hoy ? 'aprobado' : 'rechazado'}">${s.disponible_hoy ? 'Libre hoy' : 'Ocupada hoy'}</span>
              </div>
              <p class="small" style="margin:0;">${esc(s.categoria || 'General')} · ${esc(s.sede || 'AIEP')}</p>
              <div>
                <div class="cal-section-label">Hoy (${esc(data.hoy)})</div>
                <div class="tickets" style="gap:6px;">${hoyHtml}</div>
              </div>
              <div>
                <div class="cal-section-label">Mañana (${esc(data.manana)})</div>
                <div class="tickets" style="gap:6px;">${mananaHtml}</div>
              </div>
            </article>
          `;
        }).join('');
      } catch (e) {
        contenedorCalendario.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
      }
    }

    document.querySelector('#btn-refrescar-cal').addEventListener('click', cargarCalendario);

    bandeja.addEventListener('click', async e => {
      const boton = e.target.closest('[data-derivar]'); if (!boton) return;
      boton.disabled = true;
      try {
        await derivarTicket(boton.dataset.derivar, sesion.id);
        avisoTexto('Ticket derivado a Administración con éxito.', 'success');
      } catch (error) { avisoTexto(error.message || 'No se pudo derivar.', 'error'); boton.disabled = false; }
    });

    try {
      escucharTiempoReal({
        alCrearTicket: guardar,
        alActualizarTicket: guardar,
        alEstadoConexion: estado => {
          conexion.textContent = estado === 'SUBSCRIBED' ? 'En vivo' : `Tiempo real: ${estado}`;
          conexion.className = `connection ${estado === 'SUBSCRIBED' ? 'online' : ''}`;
        }
      });
      await cargarCalendario();
      (await obtenerTickets()).forEach(guardar);
      if (!tickets.size) dibujar();
    } catch (error) { bandeja.innerHTML = '<div class="empty">No se pudieron cargar los tickets.</div>'; avisoTexto(error.message, 'error'); }
  </script>
</body>
</html>
